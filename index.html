<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#337c82">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="라온수학">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>The 라온수학</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f6f6; --card:#fff; --ink:#1c2e30; --sub:#667a7c; --line:#dce7e7;
  --navy:#337c82; --navy2:#4a9499; --amber:#f2b544; --amberbg:#fff5e1;
  --red:#d6453d; --redbg:#fde9e7; --blue:#2f6fd6; --bluebg:#e6efff; --green:#22935a; --greenbg:#e2f5ea;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:84px}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between}
.top small{display:block;opacity:.7;font-size:12px}
.top b{font-size:18px}
.top .acts{display:flex;gap:6px}
.ghost{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer}
main{padding:16px}
h2{font-size:17px;margin:22px 4px 10px}
h2:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card.tap{cursor:pointer}
.card.tap:active{transform:scale(.99)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--sub);font-size:13px}
.big{font-size:34px;font-weight:900;letter-spacing:-1px}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border:0}
.hero .muted{color:rgba(255,255,255,.75)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:900}
.stat span{font-size:12px;color:var(--sub)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-red{background:var(--redbg);color:var(--red)} .b-blue{background:var(--bluebg);color:var(--blue)}
.b-green{background:var(--greenbg);color:var(--green)} .b-gray{background:#eee;color:#666} .b-amber{background:var(--amberbg);color:#b06d00}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);background:#f8fbfb;border-radius:12px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--navy2);background:#fff}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:#e3eeee;color:#245a5e}
.btn.primary{background:var(--navy);color:#fff}
.btn.amber{background:var(--amber);color:#3a2500}
.btn.green{background:var(--green);color:#fff}
.btn.danger{background:var(--redbg);color:var(--red)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.full{width:100%;margin-top:14px}
.btn:disabled{opacity:.5}
.bar{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--navy2);border-radius:99px}
.list .item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.pts{font-weight:900;color:#b06d00}
.minus{color:var(--red)}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.bottom .in{display:flex;width:100%;max-width:640px}
.bottom button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:12px;color:var(--sub);cursor:pointer}
.bottom button b{display:block;font-size:19px;line-height:1.2;margin-bottom:2px}
.bottom button.on{color:var(--navy);font-weight:700}
.login{padding:48px 22px;padding-top:max(48px,calc(env(safe-area-inset-top) + 24px))}
.brand{text-align:center;margin-bottom:26px}
.logo{display:block;width:170px;height:170px;margin:0 auto 4px;border-radius:28px;object-fit:contain;background:#fff}
.brand h1{margin:0;font-size:26px}
.brand p{margin:2px 0 0;color:var(--sub)}
.seg{display:flex;background:#e0ecec;border-radius:14px;padding:4px;margin-bottom:8px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:11px;font-weight:700;color:var(--sub);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.err{color:var(--red);font-size:13px;min-height:20px;margin:8px 2px 0}
.note{background:var(--amberbg);color:#7a4c00;border-radius:12px;padding:10px 12px;font-size:13px;margin:0 16px 0}
.login .note{margin:18px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check input{width:20px;height:20px;flex:none}
.empty{text-align:center;color:var(--sub);padding:26px 10px;font-size:14px}
.memo{background:#eef5f5;border-radius:10px;padding:8px 10px;font-size:14px;margin-top:8px;white-space:pre-wrap}
.fb{background:var(--greenbg);border-radius:10px;padding:8px 10px;font-size:14px;margin-top:8px;white-space:pre-wrap}
.ov{position:fixed;inset:0;background:rgba(20,24,35,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px 28px;position:relative}
.sheet h3{margin:0 40px 4px 2px;font-size:19px}
.x{position:absolute;right:12px;top:12px;border:0;background:#dce7e7;width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.nimg{display:block;width:100%;border-radius:12px;margin-top:10px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.imgph{margin-top:10px;border-radius:12px;background:#eef5f5;color:var(--sub);text-align:center;padding:40px 10px;font-size:13px}
.ntc{padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.ntc:last-child{border-bottom:0}
.ntc .body{white-space:pre-wrap;margin-top:6px;font-size:14px;color:var(--ink)}
.new{display:inline-block;background:var(--red);color:#fff;font-size:10px;font-weight:900;border-radius:6px;padding:1px 5px;margin-left:4px;vertical-align:2px}
.zoomwrap{overflow:auto;margin:14px -16px 0;padding:0 16px}
.zoomwrap img{display:block;border-radius:8px}
.clshead{display:flex;justify-content:space-between;align-items:baseline;margin:16px 4px 8px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.ptile{padding:16px 6px}
.ptile.on{border-color:var(--navy);background:#eef6f6}
.ptile.open{outline:2px solid var(--navy);outline-offset:-1px}
.ppanel{margin-top:10px;border:2px solid var(--navy);border-radius:14px;padding:12px 14px;background:#fff}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 6px 12px;text-align:center;cursor:pointer}
.tile:active{transform:scale(.97)}
.tile b{display:block;margin-top:2px;font-size:15px}
.ring{width:64px;height:64px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center}
.ring span{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:900;font-size:14px;color:var(--ink)}
.hwrow{padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.hwrow:first-child{border-top:0;padding-top:4px}
.todo{display:flex;align-items:flex-start;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.todo:last-child{border-bottom:0}
.todo.locked{cursor:default}
.box{flex:none;width:26px;height:26px;border:2px solid #b5cccd;border-radius:8px;display:grid;place-items:center;font-weight:900;color:#fff;margin-top:1px;transition:all .15s}
.todo.done .box{background:var(--navy);border-color:var(--navy)}
.todo.done .tt{color:var(--sub);text-decoration:line-through}
.tt{font-weight:700}
.todo .fb{margin-top:6px}
.score{font-size:22px;font-weight:900}
.scoreIn{width:90px;text-align:right}
.spin{width:28px;height:28px;border:3px solid #ddd;border-top-color:var(--navy);border-radius:50%;animation:s 1s linear infinite;margin:120px auto 12px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<img id="logoSrc" alt="" style="display:none" src="icon-512.png">
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script src="config.js"></script>
<script>

const $ = s => document.querySelector(s);
const app = $('#app');
const LOGO = ($('#logoSrc') || {}).src || '';
const esc = s => String(s ?? '').replace(new RegExp('[&<>\\x22\\x27]', 'g'), c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const md = s => { if (!s) return ''; const [, m, d] = s.split('-'); return (+m) + '월 ' + (+d) + '일'; };
const fmtTime = ms => { const d = new Date(ms); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }


const APP_VER = '2026.11.19-6';
const COLS = ['students', 'assignments', 'subs', 'points', 'tests', 'scores', 'notices', 'config'];
const S = { avgs: null }; COLS.forEach(c => S[c] = {});
let loaded = false, loadNote = '', info = null, syncing = 0, loadSeq = 0;
const API_URL = String((window.RAON_CONFIG && window.RAON_CONFIG.API_URL) || '').trim();
const HAS_API = API_URL.indexOf('https:') === 0 || API_URL.indexOf('http:') === 0;
function call(action, payload) {
  if (!HAS_API) return Promise.reject(new Error('config.js에 Apps Script 웹앱 주소를 넣어 주세요.'));
  return fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, payload: payload || {}, auth: sess }) })
    .then(r => r.text(), () => { throw new Error('서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.'); })
    .then(txt => {
      let r; try { r = JSON.parse(txt); } catch (e) { throw new Error('서버 응답을 읽지 못했어요. Apps Script 배포 설정을 확인해 주세요.'); }
      if (r && r.error) throw new Error(r.error);
      return r;
    });
}
let installEvt = null;
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = () => new RegExp('iphone|ipad|ipod', 'i').test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (!sess) render(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('앱을 설치했어요!'); });
async function installApp() { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; render(); }
const UA = navigator.userAgent || '';
const isKakao = () => new RegExp('KAKAOTALK', 'i').test(UA);
const isInApp = () => isKakao() || new RegExp('NAVER\\(inapp|Instagram|FBAN|FBAV|Line\\/|DaumApps|everytimeApp', 'i').test(UA);
const KAKAO_EXT = 'kakaotalk:' + String.fromCharCode(47, 47) + 'web/openExternal?url=';
function openExternal() { location.href = KAKAO_EXT + encodeURIComponent(location.href.split('#')[0]); }
function inAppBox() {
  return `<div class="note" style="margin-top:16px;line-height:1.6">
    <b>📲 지금은 ${isKakao() ? '카카오톡' : '앱'} 안의 브라우저라서 앱 설치가 안 돼요.</b><br>
    ${isKakao() ? `<button class="btn amber full" style="margin:10px 0 8px" onclick="openExternal()">기본 브라우저로 열기</button>` : ''}
    ${isIOS() ? '오른쪽 아래 <b>공유 버튼(⬆️)</b>을 누르고 <b>Safari로 열기</b>를 고른 뒤, 사파리에서 <b>공유 → 홈 화면에 추가</b>를 눌러 주세요.'
      : '오른쪽 아래 <b>⋮ 버튼</b>을 누르고 <b>다른 브라우저로 열기</b>를 고른 뒤, 크롬에서 다시 열어 주세요.'}
  </div>`;
}
function installBox() {
  if (isStandalone()) return '';
  if (isInApp()) return inAppBox();
  if (installEvt) return `<button class="btn amber full" onclick="installApp()">📲 휴대폰에 앱 설치하기</button>`;
  if (isIOS()) return `<div class="note" style="margin-top:16px">📲 앱으로 쓰려면 사파리 아래쪽 <b>공유 버튼</b>을 누르고 <b>홈 화면에 추가</b>를 고르세요.</div>`;
  return '';
}
function init() {
  if (isKakao() && !isStandalone()) {
    let tried = false; try { tried = sessionStorage.getItem('raon_ext') === '1'; sessionStorage.setItem('raon_ext', '1'); } catch (e) {}
    if (!tried) setTimeout(openExternal, 300);
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  render();
  call('info').then(r => { info = r; if (!sess) render(); }).catch(e => { loadNote = e.message; if (!sess) render(); });
  if (sess) load();
  setInterval(() => { if (sess && loaded && !syncing && document.visibilityState === 'visible') load(true); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && sess && loaded && !syncing) load(true); });
}
async function load(quiet) {
  const my = ++loadSeq;
  try {
    const d = await call('getData');
    if (my !== loadSeq || syncing) return;
    COLS.forEach(c => S[c] = d[c] || {}); S.avgs = d.avgs || null; S.pwSet = d.pwSet || [];
    loaded = true; loadNote = ''; scheduleRender();
  } catch (e) {
    if (my !== loadSeq) return;
    if (e.message === 'AUTH' || e.message === 'NEEDPW') { logout(); toast(e.message === 'NEEDPW' ? '비밀번호를 만들어야 해요. 다시 로그인해 주세요.' : '다시 로그인해 주세요.'); return; }
    loadNote = e.message; scheduleRender();
  }
}
const CASC = { assignments: [['subs', 'aid']], tests: [['scores', 'tid']], students: [['subs', 'sid'], ['points', 'sid'], ['scores', 'sid']] };
function applyLocal(ops) {
  ops.forEach(o => {
    if (o.op === 'put') S[o.c][o.id] = { ...o.d };
    else {
      delete S[o.c][o.id];
      (CASC[o.c] || []).forEach(([c2, f]) => Object.keys(S[c2]).forEach(k => { if (S[c2][k][f] === o.id) delete S[c2][k]; }));
    }
  });
}

async function commit(ops) {
  syncing++; loadSeq++;
  applyLocal(ops); scheduleRender();
  try { await call('ops', { ops }); }
  catch (e) {
    syncing--;
    if (e.message === 'AUTH' || e.message === 'NEEDPW') { logout(); toast('다시 로그인해 주세요.'); }
    else { toast(e.message); load(true); }
    throw e;
  }
  syncing--; if (!syncing) load(true);
}
const P = (c, id, d) => ({ op: 'put', c, id, d });
const put = (c, id, d) => commit([P(c, id, d)]);
const del = (c, id) => commit([{ op: 'del', c, id }]);


const byKo = (a, b) => String(a).localeCompare(String(b), 'ko');
const students = () => Object.entries(S.students).map(([id, v]) => ({ id, ...v }))
  .sort((a, b) => byKo(a.cls || '', b.cls || '') || byKo(a.name, b.name));
const assignments = () => Object.entries(S.assignments).map(([id, v]) => ({ id, ...v }))
  .sort((a, b) => byKo(b.due || '', a.due || '') || (b.at || 0) - (a.at || 0));
const tests = () => Object.entries(S.tests).map(([id, v]) => ({ id, ...v }))
  .sort((a, b) => byKo(b.date || '', a.date || '') || (b.at || 0) - (a.at || 0));
const pointsOf = sid => Object.entries(S.points).map(([id, v]) => ({ id, ...v })).filter(p => p.sid === sid).sort((a, b) => b.at - a.at);
const ptsOf = sid => pointsOf(sid).reduce((a, p) => a + (+p.amt || 0), 0);
const subOf = (aid, sid) => S.subs[aid + '__' + sid];
const scoreOf = (tid, sid) => S.scores[tid + '__' + sid];
const forStu = (x, s) => x.sids ? String(x.sids).split(',').includes(s.id) : (!x.cls || String(x.cls).split(',').includes(s.cls));
const targets = x => students().filter(s => forStu(x, s));
const hwTargetBadge = a => a.sids ? `<span class="badge b-amber">개별 ${String(a.sids).split(',').filter(id => S.students[id]).length}명</span>` : clsBadge(a.cls);
const classes = () => [...new Set(students().map(s => s.cls).filter(Boolean))].sort(byKo);
const cfg = () => S.config.main || {};
const pin = () => cfg().pin || '0000';
const hwPoint = () => +(cfg().hwPoint ?? 100);
const avg = arr => arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length * 10) / 10 : null;
const TT = { daily: '오늘셈', unit: '마무리셈' };
const ttype = t => t.type === 'daily' ? 'daily' : 'unit';
const typeBadge = t => `<span class="badge ${ttype(t) === 'daily' ? 'b-blue' : 'b-amber'}">${TT[ttype(t)]}</span>`;
let tfilter = 'all';
const testFilterChips = () => `<div class="chips">${[['all', '전체'], ['daily', '오늘셈'], ['unit', '마무리셈']].map(([k, l]) =>
  `<span class="chip ${tfilter === k ? 'on' : ''}" onclick="tfilter='${k}';render()">${l}</span>`).join('')}</div>`;
function testAvg(t) {
  if (S.avgs) return S.avgs[t.id] ?? null;
  return avg(targets(t).map(s => scoreOf(t.id, s.id)).filter(Boolean).map(x => +x.score));
}


let sess = LS.get('raon_sess');
let loginTab = 'student', stab = 'home', ttab = 'dash', dirty = false;
let modalFn = null;
const isTyping = () => { const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox'; };
let formDirty = false;
function scheduleRender() { if (isTyping() || formDirty) { dirty = true; return; } render(); }
document.addEventListener('focusout', () => setTimeout(() => { if (dirty && !isTyping() && !formDirty) { dirty = false; render(); } }, 60));

function banner() {
  return loadNote && loaded ? `<div style="padding-top:12px"><div class="note">${esc(loadNote)}</div></div>` : '';
}
function render() {
  if (!sess) renderLogin();
  else if (!loaded) {
    app.innerHTML = loadNote ? `<div class="login"><div class="card empty">${esc(loadNote)}<br><br>
      <button class="btn primary" onclick="loadNote='';render();load()">다시 시도</button> <button class="btn" onclick="logout()">로그아웃</button></div></div>`
      : `<div class="spin"></div><p class="empty">불러오는 중…</p>`;
  } else if (sess.role === 'student') {
    const st = S.students[sess.sid];
    if (!st) { logout(); return; }

function groupByCls(list) {

  const title = $('#ntitle').value.trim(), body = $('#nbody').value.trim(), cls = pickedCls('ncls');
  if (!title) return toast('제목을 입력해 주세요.');
  formDirty = false;
  try { await put('notices', uid(), { title, body, cls, at: Date.now() }); toast('알림을 올렸어요'); } catch (e) {}
}
async function delNotice(id) { try { await del('notices', id); toast('삭제했어요'); } catch (e) {} }
function shrinkImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const s = Math.min(1, 1800 / Math.max(im.naturalWidth, im.naturalHeight));
      const w = Math.round(im.naturalWidth * s), hgt = Math.round(im.naturalHeight * s);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = hgt;
      const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, hgt); x.drawImage(im, 0, 0, w, hgt);
      URL.revokeObjectURL(url);
      let q = 0.88, d = cv.toDataURL('image/jpeg', q);
      while (d.length > 1500000 && q > 0.45) { q -= 0.1; d = cv.toDataURL('image/jpeg', q); }
      res(d);
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('이미지 파일을 열 수 없어요.')); };
    im.src = url;
  });
}
async function uploadImage() {
  const f = $('#nimgFile').files[0], title = $('#nimgTitle').value.trim() || '분기 안내', cls = pickedCls('nimgCls');
  if (!f) return toast('이미지 파일을 골라 주세요.');
  formDirty = false; imgBusy = true; render();
  try {
    const data = await shrinkImage(f);
    const r = await call('setImage', { title, cls, data });
    const m = r.meta;
    S.config.main = { ...cfg(), imgs: [...(cfg().imgs || []).filter(x => x.id !== m.id), m] };
    imgs[m.id] = { ver: m.ver, data }; LS.set('raon_img_' + m.id, { ver: m.ver, data });
    toast((cls ? cls.split(',').join(', ') : '전체') + ' 안내문을 올렸어요'); load(true);
  } catch (e) { toast(e.message); }
  imgBusy = false; render();
}
async function delImage(id) {
  try {
    await call('delImage', { id });
    S.config.main = { ...cfg(), imgs: (cfg().imgs || []).filter(x => x.id !== id) };
    delete imgs[id]; toast('이미지를 내렸어요'); render();
  } catch (e) { toast(e.message); }
}
function openModal(fn) { modalFn = fn; renderModal(); }
function closeModal() { modalFn = null; armed = ''; $('#modal').innerHTML = ''; }
function renderModal() {
  if (!modalFn) return;
  const h = modalFn(); if (h == null) { closeModal(); return; }
  const old = $('#modal .sheet'), top = old ? old.scrollTop : 0;
  $('#modal').innerHTML = `<div class="ov" onclick="if(event.target===this)closeModal()"><div class="sheet"><button class="x" onclick="closeModal()">×</button>${h}</div></div>`;
  $('#modal .sheet').scrollTop = top;
}

init();
